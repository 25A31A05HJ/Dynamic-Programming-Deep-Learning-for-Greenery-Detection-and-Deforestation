project:
  name: Glacier_Road_Drainage_AI
  random_seed: 42
  crs: EPSG:32645
  resolution_m: 10

time:
  lake_start_year: 2016
  lake_end_year: 2025
  lake_months: [8, 9, 10]
  road_dates: [2019, 2025]

sentinel2:
  bands: [B02, B03, B04, B08, B11, B12]
  max_cloud_percent: 30
  resolution_m: 10

preprocessing:
  tile_size: 256
  stride: 192
  min_observation_count: 2
  scale_factor: 0.0001

lake:
  mndwi_threshold_method: otsu
  min_component_pixels: 9
  glacier_buffer_km: 10
  illustrative_max_slope_deg: 12
  illustrative_min_elevation_m: 2500
  model: unet_resnet34
  epochs: 60
  batch_size: 16
  learning_rate: 0.0003

road:
  model: dlinknet_or_unet
  loss: bce_dice
  tile_size: 256
  topology_min_component_pixels: 8

drainage:
  channel_buffer_m: 30
  vulnerability_weights:
    flow_accumulation: 0.30
    hand: 0.20
    built_up_change: 0.20
    waterlogging: 0.30

change:
  trend_method: mann_kendall_sen
  compare_methods: [post_classification]
